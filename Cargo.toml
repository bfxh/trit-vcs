[package]
name = "trit-vcs"
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bfxh/trit-vcs"
description = "内容寻址的三进制协作版本库：BLAKE3 + 内容定义分块 + 哈希链事件日志 + 认领门（不属于稳定 API）"
publish = false

[[bin]]
name = "trit-vcs"
path = "src/bin/trit-vcs/main.rs"

[dependencies]
# 三值裁决层与编排内核属于 `bfxh/trit`，**按边界只 pin 不复制**：
# 复制进来就等于把「哪个是正本」问错了对象（STE/量化/编排同口径）。
# rev 钉到拆库时的那笔提交，改 pin 要显式提交，不许跟着 main 漂。
trit-core = { git = "https://github.com/bfxh/trit", rev = "2400fb9d2de751cab358455e3bf622b7a3288f1c", package = "trit-core" }
trit-orch = { git = "https://github.com/bfxh/trit", rev = "2400fb9d2de751cab358455e3bf622b7a3288f1c", package = "trit-orch" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
blake3 = "1.5"
flate2 = "1.0"

[[example]]
name = "vcs_bench"
path = "examples/vcs_bench.rs"
