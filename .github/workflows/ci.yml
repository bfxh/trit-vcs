name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支再推一笔就取消上一轮：旧 run 的结果没人看，留着只占并发额度，还让人误判"还在跑"。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 内部依赖（trit-core / trit-orch）是 bfxh/trit 的 git pin：默认 runner 直连 GitHub，
  # 不需要本机那套 insteadOf/代理口径。
  TMPDIR: /tmp

jobs:
  policy:
    name: change policy (tier & contract)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/change_policy.py --self-test
      - run: python scripts/repo_triage.py --self-test
      - name: grade this change (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/change_policy.py --base "$BASE_SHA" --event "$GITHUB_EVENT_PATH"
      - name: grade this change (push)
        if: github.event_name == 'push'
        run: python scripts/change_policy.py --base "${{ github.event.before }}"

  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --workspace --locked

  gates:
    name: gates (module budget + test surface + docs + integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gate self-tests
        run: |
          set -euo pipefail
          for script in module_budget test_surface docs_hygiene ci_integrity change_policy repo_triage mutation_check; do
            python "scripts/$script.py" --self-test
          done
      - name: 上帝模块门（800 行；基线只许变短）
        run: python scripts/module_budget.py
      - name: 测试面棘轮（每条测试都要真判东西）
        run: python scripts/test_surface.py
      - name: 文档卫生（CHANGELOG 形状 + 盘符路径只许变少）
        run: python scripts/docs_hygiene.py
      - name: 保护规则 ↔ workflow 对账（清单与 job 名双向；GitHub 侧真值靠 --remote 本地/巡检核对，Actions 的 token 读不到保护 API）
        run: python scripts/ci_integrity.py

  # 变异门按面拆两条并行：整包一起跑要 18 分钟以上，拆开一条红不挡另一条的读数。
  # 全量口径在 .github/workflows/nightly.yml（schedule + dispatch），不设必需检查。
  mutation:
    name: mutation gate (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [library, gates]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect changed targets
        id: crates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FACE: ${{ matrix.target }}
        run: bash scripts/mutation_targets.sh "$FACE" "${BASE_SHA:-origin/main}" >> "$GITHUB_OUTPUT"
      - name: 采集器不许静默空跑
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ARGS: ${{ steps.crates.outputs.args }}
          FACE_STATUS: ${{ matrix.target }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-origin/main}"
          if [ "$FACE_STATUS" = "library" ] \
             && git diff --name-only "$base"...HEAD | grep -qE '^(src|tests|examples)/|^Cargo\.toml$' \
             && [ -z "$ARGS" ]; then
            echo "FAIL 改了库面却一个变异目标都没选出来 ⇒ 采集器静默失效（空 args = 这道门整条不跑）"
            exit 1
          fi
      - name: mutation
        if: steps.crates.outputs.args != ''
        run: python scripts/mutation_check.py ${{ steps.crates.outputs.args }}

  claims:
    name: claims self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/agent_claims.py --self-test
