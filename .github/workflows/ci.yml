name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: read

# 同一分支上再推一笔就取消上一轮的跑：旧 run 的结果没人看，留着只是占并发额度 + 让人以为"还在跑"。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 内部依赖（trit-core / trit-orch）是 bfxh/trit 的 git pin：actions 的默认 runner 直连 GitHub，
  # 不需要本机那套 insteadOf/代理口径。
  TMPDIR: /tmp

jobs:
  policy:
    name: change policy (tier & contract)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: self-test
        run: python scripts/change_policy.py --self-test
      - name: triage self-test
        run: python scripts/repo_triage.py --self-test
      - name: grade this change
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/change_policy.py --base "$BASE_SHA" --event "$GITHUB_EVENT_PATH"
      - name: grade main push
        if: github.event_name == 'push'
        run: python scripts/change_policy.py --base "${{ github.event.before }}"

  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --workspace --locked

  # 变异门按面拆开并行：整包一起跑要 18 分钟以上，分成"库面"与"门脚本"两条后各 ~15 分钟，
  # 而且一条红不会挡住另一条的读数。
  mutation:
    name: mutation gate (${{ matrix.target }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [library, gates]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect changed targets
        id: crates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FACE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bash scripts/mutation_targets.sh "${FACE}" "${BASE_SHA:-origin/main}" >> "$GITHUB_OUTPUT"
      - name: gate self-test
        if: matrix.target == 'gates'
        run: python scripts/mutation_check.py --self-test
      - name: 采集器不许静默空跑
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ARGS: ${{ steps.crates.outputs.args }}
          FACE_STATUS: ${{ matrix.target }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-origin/main}"
          if git diff --name-only "$base"...HEAD | grep -qE '^(src|tests|examples)/|^Cargo\.toml$' \
             && [ "$FACE_STATUS" = "library" ] && [ -z "$ARGS" ]; then
            echo "FAIL 改了库面却一个变异目标都没选出来 ⇒ 采集器静默失效（空 args = 这条门整条不跑）"
            exit 1
          fi
        continue-on-error: false
        id: anti_noop
      - name: mutation
        if: steps.crates.outputs.args != ''
        run: python scripts/mutation_check.py ${{ steps.crates.outputs.args }}

  mutation-nightly:
    name: mutation gate (full)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 全量：库面 + 门自身 + 认领账本 + 两道新治理门（登记表在 scripts/mutants/）。
      # 判红口径：存活、编译红假杀、超时、无输出都算红；声明 hang_secs 的死循环单列、不计入抓住。
      - run: python scripts/mutation_check.py

  claims:
    name: claims self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/agent_claims.py --self-test
